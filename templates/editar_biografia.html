{% extends "base.html" %}
{% block title %}Editar biografia{% endblock %}
{% block contenido %}
    <h1>Editar biografia de {{ estudiante['nombre'] }}</h1>
    <form method="POST" action="{{ url_for('editar_biografia', id=estudiante['id']) }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <textarea name="biografia" rows="5" cols="50">{{ estudiante['biografia'] }}</textarea>
        <button type="submit">Guardar</button>
    </form>
{% endblock %}
