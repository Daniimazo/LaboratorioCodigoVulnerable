{% extends "base.html" %}
{% block title %}Subir archivo{% endblock %}
{% block contenido %}
    <h1>Subir archivo</h1>
    <form method="POST" action="{{ url_for('subir') }}" enctype="multipart/form-data">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="file" name="archivo" accept=".pdf,.png,.jpg,.jpeg" required>
        <button type="submit">Subir</button>
    </form>
    <p>Formatos permitidos: PDF, PNG y JPG. Tamano maximo: 5 MB.</p>
{% endblock %}
