{% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}<div class="notice-stack" aria-live="polite">
        {% for category, message in messages %}
            <div class="notice notice-{{ 'error' if category == 'error' else 'success' }}" role="status">
                <span class="notice-icon" aria-hidden="true">{{ '!' if category == 'error' else '✓' }}</span>
                <span>{{ message }}</span>
            </div>
        {% endfor %}
    </div>{% endif %}
{% endwith %}
